<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>iDonate - Verify OTP</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            min-height: 100vh;
            background: linear-gradient(to bottom right, #fef2f2, #fce7f3);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem;
        }
        .card {
            background: white;
            border-radius: 0.5rem;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1);
            padding: 2.5rem 2rem;
            max-width: 28rem;
            width: 100%;
        }
        .logo-container {
            text-align: center;
            margin-bottom: 1.5rem;
        }
        .logo-container img {
            max-width: 120px;
            height: auto;
        }
        .header {
            text-align: center;
            margin-bottom: 2rem;
        }
        .header h2 {
            color: #1f2937;
            font-size: 1.5rem;
            margin-bottom: 0.5rem;
        }
        .header p {
            color: #6b7280;
            font-size: 0.875rem;
        }
        .header .email-display {
            color: #dc2626;
            font-weight: 600;
        }
        .error {
            background-color: #fee2e2;
            border: 1px solid #fca5a5;
            color: #991b1b;
            padding: 1rem;
            border-radius: 0.5rem;
            margin-bottom: 1.5rem;
            font-size: 0.875rem;
        }
        .success {
            background-color: #d1fae5;
            border: 1px solid #6ee7b7;
            color: #065f46;
            padding: 1rem;
            border-radius: 0.5rem;
            margin-bottom: 1.5rem;
            font-size: 0.875rem;
        }
        .otp-container {
            margin-bottom: 1.5rem;
        }
        .otp-label {
            display: block;
            font-weight: 600;
            color: #374151;
            margin-bottom: 0.75rem;
            font-size: 0.875rem;
        }
        .otp-input-group {
            display: flex;
            gap: 0.5rem;
            justify-content: center;
        }
        .otp-input {
            width: 3rem;
            height: 3.5rem;
            text-align: center;
            font-size: 1.5rem;
            font-weight: 600;
            border: 2px solid #d1d5db;
            border-radius: 0.5rem;
            color: #1f2937;
            transition: all 0.2s ease;
        }
        .otp-input:focus {
            outline: none;
            border-color: #dc2626;
            box-shadow: 0 0 0 3px rgba(220, 38, 38, 0.1);
        }
        .otp-input.filled {
            border-color: #dc2626;
            background-color: #fef2f2;
        }
        button {
            width: 100%;
            background-color: #dc2626;
            color: white;
            padding: 0.875rem;
            border-radius: 0.5rem;
            font-weight: 600;
            font-size: 1rem;
            border: none;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        button:hover:not(:disabled) {
            background-color: #b91c1c;
            transform: translateY(-1px);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }
        button:disabled {
            background-color: #9ca3af;
            cursor: not-allowed;
            transform: none;
        }
        .resend-section {
            margin-top: 1.5rem;
            text-align: center;
            color: #6b7280;
            font-size: 0.875rem;
        }
        .resend-btn {
            background: none;
            border: none;
            color: #dc2626;
            font-weight: 600;
            cursor: pointer;
            padding: 0;
            width: auto;
            display: inline;
            text-decoration: underline;
        }
        .resend-btn:hover:not(:disabled) {
            color: #b91c1c;
            transform: none;
            box-shadow: none;
        }
        .resend-btn:disabled {
            color: #9ca3af;
            cursor: not-allowed;
        }
        .timer {
            color: #dc2626;
            font-weight: 600;
        }
        .back-link {
            margin-top: 1rem;
            text-align: center;
            color: #6b7280;
            font-size: 0.875rem;
        }
        .back-link a {
            color: #dc2626;
            font-weight: 600;
            text-decoration: none;
        }
        .back-link a:hover {
            text-decoration: underline;
        }
        @media (max-width: 640px) {
            .otp-input {
                width: 2.5rem;
                height: 3rem;
                font-size: 1.25rem;
            }
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="logo-container">
            <img src="logo.png" alt="iDonate Logo">
        </div>
        
        <div class="header">
            <h2>Verify Your Account</h2>
            <p>Enter the 6-digit OTP sent to your email</p>
            <p class="email-display" id="emailDisplay"></p>
        </div>

        <div id="error" class="error" style="display: none;"></div>
        <div id="success" class="success" style="display: none;"></div>

        <div class="otp-container">
            <label class="otp-label">Enter OTP</label>
            <div class="otp-input-group">
                <input type="text" class="otp-input" maxlength="1" data-index="0" autocomplete="off">
                <input type="text" class="otp-input" maxlength="1" data-index="1" autocomplete="off">
                <input type="text" class="otp-input" maxlength="1" data-index="2" autocomplete="off">
                <input type="text" class="otp-input" maxlength="1" data-index="3" autocomplete="off">
                <input type="text" class="otp-input" maxlength="1" data-index="4" autocomplete="off">
                <input type="text" class="otp-input" maxlength="1" data-index="5" autocomplete="off">
            </div>
        </div>

        <button type="button" id="verifyBtn">Verify OTP</button>

        <div class="resend-section">
            <p>Didn't receive the code? 
                <button type="button" class="resend-btn" id="resendBtn">Resend OTP</button>
            </p>
            <p id="timerText" style="margin-top: 0.5rem; display: none;">
                Resend available in <span class="timer" id="timer">60</span>s
            </p>
        </div>

        <div class="back-link">
            <a href="./Register.html">← Back to Registration</a>
        </div>
    </div>

    <script>
        const API_BASE = "https://localhost:8000";
        let timerInterval;

        const email = localStorage.getItem("pending_email");
        if (!email) {
            window.location.href = "./Register.html";
        }

        document.getElementById("emailDisplay").textContent = email;

        const otpInputs = document.querySelectorAll(".otp-input");

        otpInputs.forEach((input, index) => {
            input.addEventListener("input", (e) => {
                const value = e.target.value;
                
                if (value.match(/[^0-9A-Fa-f]/)) {
                    e.target.value = "";
                    return;
                }
                
                e.target.value = value.toUpperCase();
                
                if (value) {
                    e.target.classList.add("filled");
                    if (index < otpInputs.length - 1) {
                        otpInputs[index + 1].focus();
                    }
                } else {
                    e.target.classList.remove("filled");
                }
            });

            input.addEventListener("keydown", (e) => {
                if (e.key === "Backspace" && !e.target.value && index > 0) {
                    otpInputs[index - 1].focus();
                    otpInputs[index - 1].value = "";
                    otpInputs[index - 1].classList.remove("filled");
                }
            });

            input.addEventListener("paste", (e) => {
                e.preventDefault();
                const pastedData = e.clipboardData.getData("text").toUpperCase().replace(/[^0-9A-F]/g, "");
                
                for (let i = 0; i < Math.min(pastedData.length, otpInputs.length); i++) {
                    otpInputs[i].value = pastedData[i];
                    otpInputs[i].classList.add("filled");
                }
                
                if (pastedData.length >= otpInputs.length) {
                    otpInputs[otpInputs.length - 1].focus();
                } else {
                    otpInputs[pastedData.length]?.focus();
                }
            });
        });

        function getOTP() {
            return Array.from(otpInputs).map(input => input.value).join("");
        }

        function clearOTP() {
            otpInputs.forEach(input => {
                input.value = "";
                input.classList.remove("filled");
            });
            otpInputs[0].focus();
        }

        function showError(message) {
            const errorDiv = document.getElementById("error");
            errorDiv.textContent = message;
            errorDiv.style.display = "block";
            document.getElementById("success").style.display = "none";
        }

        function showSuccess(message) {
            const successDiv = document.getElementById("success");
            successDiv.textContent = message;
            successDiv.style.display = "block";
            document.getElementById("error").style.display = "none";
        }

        function hideMessages() {
            document.getElementById("error").style.display = "none";
            document.getElementById("success").style.display = "none";
        }

        function startResendTimer() {
            let timeLeft = 60;
            const timerText = document.getElementById("timerText");
            const timerSpan = document.getElementById("timer");
            const resendBtn = document.getElementById("resendBtn");
            
            timerText.style.display = "block";
            resendBtn.disabled = true;
            
            timerInterval = setInterval(() => {
                timeLeft--;
                timerSpan.textContent = timeLeft;
                
                if (timeLeft <= 0) {
                    clearInterval(timerInterval);
                    timerText.style.display = "none";
                    resendBtn.disabled = false;
                }
            }, 1000);
        }

        document.getElementById("verifyBtn").addEventListener("click", async () => {
            hideMessages();
            
            const otp = getOTP();
            
            if (otp.length !== 6) {
                showError("Please enter the complete 6-digit OTP");
                return;
            }

            const verifyBtn = document.getElementById("verifyBtn");
            verifyBtn.disabled = true;
            verifyBtn.textContent = "Verifying...";

            try {
                const response = await fetch(`${API_BASE}/auth/verify-otp`, {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json",
                    },
                    body: JSON.stringify({
                        email,
                        otp
                    }),
                });

                if (!response.ok) {
                    const err = await response.json().catch(() => null);
                    throw new Error(err?.detail || "OTP verification failed");
                }

                const data = await response.json();
                
                localStorage.setItem("token", data.access_token);
                localStorage.removeItem("pending_email");
                
                showSuccess("Account verified successfully! Redirecting...");
                
                setTimeout(() => {
                    window.location.href = "./Dashboard.html";
                }, 1500);

            } catch (err) {
                showError(err.message);
                clearOTP();
                verifyBtn.disabled = false;
                verifyBtn.textContent = "Verify OTP";
            }
        });

        document.getElementById("resendBtn").addEventListener("click", async () => {
            hideMessages();
            
            const resendBtn = document.getElementById("resendBtn");
            const originalText = resendBtn.textContent;
            resendBtn.disabled = true;
            resendBtn.textContent = "Sending...";

            try {
                showSuccess("Resending OTP... Please wait.");
                
                setTimeout(() => {
                    showSuccess("New OTP has been sent to your email!");
                    clearOTP();
                    startResendTimer();
                }, 1500);

            } catch (err) {
                showError("Failed to resend OTP. Please try again.");
                resendBtn.disabled = false;
                resendBtn.textContent = originalText;
            }
        });

        otpInputs[0].focus();
        startResendTimer();
    </script>
</body>
</html>
