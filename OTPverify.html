<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>iDonate - Verify OTP</title>
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#dc2626">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="iDonate">
    <link rel="apple-touch-icon" href="/icons/icon-192x192.png">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            min-height: 100vh;
            background: linear-gradient(to bottom right, #fef2f2, #fce7f3);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem;
        }
        .card {
            background: white;
            border-radius: 0.5rem;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1);
            padding: 2.5rem 2rem;
            max-width: 28rem;
            width: 100%;
        }
        .logo-container {
            text-align: center;
            margin-bottom: 1.5rem;
        }
        .logo-container img {
            max-width: 120px;
            height: auto;
        }
        .header {
            text-align: center;
            margin-bottom: 2rem;
        }
        .header h2 {
            color: #1f2937;
            font-size: 1.5rem;
            margin-bottom: 0.5rem;
        }
        .header p {
            color: #6b7280;
            font-size: 0.875rem;
        }
        .header .email-display {
            color: #dc2626;
            font-weight: 600;
        }
        .error {
            background-color: #fee2e2;
            border: 1px solid #fca5a5;
            color: #991b1b;
            padding: 1rem;
            border-radius: 0.5rem;
            margin-bottom: 1.5rem;
            font-size: 0.875rem;
        }
        .success {
            background-color: #d1fae5;
            border: 1px solid #6ee7b7;
            color: #065f46;
            padding: 1rem;
            border-radius: 0.5rem;
            margin-bottom: 1.5rem;
            font-size: 0.875rem;
        }
        .otp-container {
            margin-bottom: 1.5rem;
        }
        .otp-label {
            display: block;
            font-weight: 600;
            color: #374151;
            margin-bottom: 0.75rem;
            font-size: 0.875rem;
        }
        .otp-input-group {
            display: flex;
            gap: 0.5rem;
            justify-content: center;
        }
        .otp-input {
            width: 3rem;
            height: 3.5rem;
            text-align: center;
            font-size: 1.5rem;
            font-weight: 600;
            border: 2px solid #d1d5db;
            border-radius: 0.5rem;
            color: #1f2937;
            transition: all 0.2s ease;
            /* FIX 3: inputmode="numeric" on mobile shows number keyboard */
            inputmode: numeric;
        }
        .otp-input:focus {
            outline: none;
            border-color: #dc2626;
            box-shadow: 0 0 0 3px rgba(220, 38, 38, 0.1);
        }
        .otp-input.filled {
            border-color: #dc2626;
            background-color: #fef2f2;
        }
        button {
            width: 100%;
            background-color: #dc2626;
            color: white;
            padding: 0.875rem;
            border-radius: 0.5rem;
            font-weight: 600;
            font-size: 1rem;
            border: none;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        button:hover:not(:disabled) {
            background-color: #b91c1c;
            transform: translateY(-1px);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }
        button:disabled {
            background-color: #9ca3af;
            cursor: not-allowed;
            transform: none;
        }
        .resend-section {
            margin-top: 1.5rem;
            text-align: center;
            color: #6b7280;
            font-size: 0.875rem;
        }
        .resend-btn {
            background: none;
            border: none;
            color: #dc2626;
            font-weight: 600;
            cursor: pointer;
            padding: 0;
            width: auto;
            display: inline;
            text-decoration: underline;
        }
        .resend-btn:hover:not(:disabled) {
            color: #b91c1c;
            transform: none;
            box-shadow: none;
        }
        .resend-btn:disabled {
            color: #9ca3af;
            cursor: not-allowed;
        }
        .timer {
            color: #dc2626;
            font-weight: 600;
        }
        .back-link {
            margin-top: 1rem;
            text-align: center;
            color: #6b7280;
            font-size: 0.875rem;
        }
        .back-link a {
            color: #dc2626;
            font-weight: 600;
            text-decoration: none;
        }
        .back-link a:hover {
            text-decoration: underline;
        }
        @media (max-width: 640px) {
            .otp-input {
                width: 2.5rem;
                height: 3rem;
                font-size: 1.25rem;
            }
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="logo-container">
            <img src="logo.png" alt="iDonate Logo">
        </div>
        <div class="header">
            <h2>Verify Your Account</h2>
            <p>Enter the 6-digit OTP sent to your email</p>
            <p class="email-display" id="emailDisplay"></p>
        </div>
        <div id="error" class="error" style="display: none;"></div>
        <div id="success" class="success" style="display: none;"></div>
        <div class="otp-container">
            <label class="otp-label">Enter OTP</label>
            <div class="otp-input-group">
                <!-- FIX 3: type="tel" + inputmode="numeric" enforces numeric keyboard on mobile -->
                <input type="tel" class="otp-input" maxlength="1" data-index="0" autocomplete="off" inputmode="numeric" pattern="[0-9]">
                <input type="tel" class="otp-input" maxlength="1" data-index="1" autocomplete="off" inputmode="numeric" pattern="[0-9]">
                <input type="tel" class="otp-input" maxlength="1" data-index="2" autocomplete="off" inputmode="numeric" pattern="[0-9]">
                <input type="tel" class="otp-input" maxlength="1" data-index="3" autocomplete="off" inputmode="numeric" pattern="[0-9]">
                <input type="tel" class="otp-input" maxlength="1" data-index="4" autocomplete="off" inputmode="numeric" pattern="[0-9]">
                <input type="tel" class="otp-input" maxlength="1" data-index="5" autocomplete="off" inputmode="numeric" pattern="[0-9]">
            </div>
        </div>
        <button type="button" id="verifyBtn">Verify OTP</button>
        <div class="resend-section">
            <p>Didn't receive the code?
                <button type="button" class="resend-btn" id="resendBtn" style="display:none;">Resend OTP</button>
            </p>
            <p id="timerText" style="margin-top: 0.5rem; display: none;">
                Resend available in <span class="timer" id="timer">60</span>s
            </p>
        </div>
        <div class="back-link">
            <a href="./Register.html">← Back to Registration</a>
        </div>
    </div>

    <script>
        const API_BASE = 'https://idonate-backend-hy7w.onrender.com';
        let timerInterval;
        let otpExpired = false;   // flips true when 60-second countdown ends

        // ── FIX 1 & 2: If user is already fully logged in, redirect to Dashboard.
        (function checkAlreadyLoggedIn() {
            const token = localStorage.getItem('token');
            if (token) {
                history.replaceState(null, '', './Dashboard.html');
                window.location.replace('./Dashboard.html');
            }
        })();

        const email = localStorage.getItem("pending_email");
        if (!email) {
            // No pending registration in progress — send back to Register
            window.location.replace("./Register.html");
        }

        document.getElementById("emailDisplay").textContent = email;

        // ── FIX 4: Replace OTP page in history so back button cannot return to it
        // once the user arrives here from Register.
        history.replaceState({ page: 'otp' }, '', './OTPverify.html');

        // If back is pressed from OTP page, go to Register (not further back)
        window.addEventListener('popstate', function () {
            if (localStorage.getItem('token')) {
                window.location.replace('./Dashboard.html');
            } else {
                window.location.replace('./Register.html');
            }
        });

        const otpInputs = document.querySelectorAll(".otp-input");

        // ── Distribute digits from a pasted string into all OTP boxes ──────────
        function distributePaste(digits) {
            const clean = digits.replace(/[^0-9]/g, "");
            otpInputs.forEach((input, i) => {
                input.value = clean[i] || "";
                input.classList.toggle("filled", !!clean[i]);
            });
            // Focus the next empty box, or the last box if all filled
            const nextEmpty = clean.length < otpInputs.length ? clean.length : otpInputs.length - 1;
            otpInputs[nextEmpty].focus();
        }

        // ── Attach paste handler to the whole container so ANY box triggers it ─
        document.querySelector(".otp-input-group").addEventListener("paste", (e) => {
            e.preventDefault();
            distributePaste(e.clipboardData.getData("text"));
        });

        otpInputs.forEach((input, index) => {
            input.addEventListener("input", (e) => {
                // Allow only a single digit; strip everything else
                const raw = e.target.value.replace(/[^0-9]/g, "");

                // If user typed/pasted multiple chars into one box, treat as paste
                if (raw.length > 1) {
                    distributePaste(raw);
                    return;
                }

                e.target.value = raw;

                if (raw) {
                    e.target.classList.add("filled");
                    if (index < otpInputs.length - 1) {
                        otpInputs[index + 1].focus();
                    }
                } else {
                    e.target.classList.remove("filled");
                }
            });

            input.addEventListener("keydown", (e) => {
                // Block non-numeric keys (allow control keys through)
                const allowed = ["Backspace","Delete","Tab","ArrowLeft","ArrowRight","Home","End"];
                if (!allowed.includes(e.key) && !/^[0-9]$/.test(e.key) && !e.ctrlKey && !e.metaKey) {
                    e.preventDefault();
                }
                if (e.key === "Backspace" && !e.target.value && index > 0) {
                    otpInputs[index - 1].focus();
                    otpInputs[index - 1].value = "";
                    otpInputs[index - 1].classList.remove("filled");
                }
            });

            // Select existing digit on focus so typing replaces it cleanly
            input.addEventListener("focus", (e) => e.target.select());
        });

        function getOTP() {
            return Array.from(otpInputs).map(input => input.value).join("");
        }

        function clearOTP() {
            otpInputs.forEach(input => {
                input.value = "";
                input.classList.remove("filled");
            });
            otpInputs[0].focus();
        }

        function showError(message) {
            const errorDiv = document.getElementById("error");
            errorDiv.textContent = message;
            errorDiv.style.display = "block";
            document.getElementById("success").style.display = "none";
        }

        function showSuccess(message) {
            const successDiv = document.getElementById("success");
            successDiv.textContent = message;
            successDiv.style.display = "block";
            document.getElementById("error").style.display = "none";
        }

        function hideMessages() {
            document.getElementById("error").style.display = "none";
            document.getElementById("success").style.display = "none";
        }

        function startResendTimer() {
            let timeLeft = 60;
            const timerText = document.getElementById("timerText");
            const timerSpan = document.getElementById("timer");
            const resendBtn = document.getElementById("resendBtn");

            otpExpired = false;
            timerText.style.display = "block";
            resendBtn.style.display = "none";   // hide Resend while counting

            clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                timeLeft--;
                timerSpan.textContent = timeLeft;
                if (timeLeft <= 0) {
                    clearInterval(timerInterval);
                    timerText.style.display = "none";
                    resendBtn.style.display = "inline"; // show Resend
                    resendBtn.disabled = false;
                    otpExpired = true;
                    showError("OTP expired. Please request a new OTP.");
                    clearOTP();
                }
            }, 1000);
        }

        document.getElementById("verifyBtn").addEventListener("click", async () => {
            hideMessages();
            const otp = getOTP();

            if (otp.length !== 6) {
                showError("Please enter the complete 6-digit OTP");
                return;
            }

            // Block submission if the client-side timer already expired
            if (otpExpired) {
                showError("OTP expired. Please request a new OTP.");
                return;
            }

            const verifyBtn = document.getElementById("verifyBtn");
            verifyBtn.disabled = true;
            verifyBtn.textContent = "Verifying...";

            try {
                const response = await fetch(`${API_BASE}/auth/verify-otp`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ email, otp }),
                });

                if (!response.ok) {
                    const err = await response.json().catch(() => null);
                    throw new Error(err?.detail || "OTP verification failed");
                }

                const data = await response.json();
                localStorage.setItem("token", data.access_token);
                localStorage.removeItem("pending_email");

                showSuccess("Account verified successfully! Redirecting...");

                setTimeout(() => {
                    // ── FIX 4: Replace OTP page in history so back button from
                    // Dashboard cannot return to OTP or Register pages.
                    history.replaceState(null, '', './Dashboard.html');
                    window.location.replace('./Dashboard.html');
                }, 1500);

            } catch (err) {
                showError(err.message);
                clearOTP();
                verifyBtn.disabled = false;
                verifyBtn.textContent = "Verify OTP";
            }
        });

        document.getElementById("resendBtn").addEventListener("click", async () => {
            hideMessages();
            const resendBtn = document.getElementById("resendBtn");
            resendBtn.disabled = true;
            resendBtn.textContent = "Sending...";

            try {
                const response = await fetch(`${API_BASE}/auth/resend-otp`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ email }),
                });

                if (!response.ok) {
                    const err = await response.json().catch(() => null);
                    throw new Error(err?.detail || "Failed to resend OTP. Please try again.");
                }

                showSuccess("New OTP has been sent to your email!");
                resendBtn.textContent = "Resend OTP";
                clearOTP();
                otpExpired = false;
                startResendTimer();

            } catch (err) {
                showError(err.message);
                resendBtn.disabled = false;
                resendBtn.textContent = "Resend OTP";
            }
        });

        otpInputs[0].focus();
        startResendTimer();
    </script>

    <script src="/pwa-register.js"></script>
</body>
</html>
