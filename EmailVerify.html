<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>iDonate - Verify Email</title>
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#dc2626">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="iDonate">
    <link rel="apple-touch-icon" href="/icons/icon-192x192.png">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            min-height: 100vh;
            background: linear-gradient(to bottom right, #fef2f2, #fce7f3);
            display: flex; align-items: center; justify-content: center; padding: 1rem;
        }
        .card {
            background: white; border-radius: 0.5rem;
            box-shadow: 0 20px 25px -5px rgba(0,0,0,0.1);
            padding: 2.5rem 2rem; max-width: 28rem; width: 100%;
            text-align: center;
        }
        .logo-container { margin-bottom: 1.5rem; }
        .logo-container img { max-width: 130px; height: auto; }

        /* ── Spinner state ── */
        .state-loading { display: block; }
        .state-success { display: none; }
        .state-error   { display: none; }

        .spinner {
            width: 48px; height: 48px; border: 4px solid #fee2e2;
            border-top-color: #dc2626; border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 1.25rem;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        .icon { font-size: 3rem; margin-bottom: 1rem; }

        h2 { color: #1f2937; font-size: 1.375rem; margin-bottom: 0.75rem; }

        p { color: #6b7280; font-size: 0.9rem; line-height: 1.6; margin-bottom: 0.5rem; }

        .msg-box {
            padding: 1rem; border-radius: 0.5rem; margin: 1rem 0; font-size: 0.9rem;
        }
        .msg-success { background:#d1fae5; border:1px solid #6ee7b7; color:#065f46; }
        .msg-error   { background:#fee2e2; border:1px solid #fca5a5; color:#991b1b; }

        .btn {
            display: inline-block; margin-top: 1.25rem;
            background: #dc2626; color: white;
            padding: 0.75rem 2rem; border-radius: 0.5rem;
            text-decoration: none; font-weight: 600;
            transition: background 0.3s ease;
        }
        .btn:hover { background: #b91c1c; }
        .btn-outline {
            display: inline-block; margin-top: 0.75rem;
            background: transparent; color: #dc2626;
            padding: 0.6rem 1.5rem; border-radius: 0.5rem;
            text-decoration: none; font-weight: 600;
            border: 1.5px solid #dc2626;
            transition: all 0.3s ease;
        }
        .btn-outline:hover { background: #fef2f2; }
    </style>
</head>
<body>
    <div class="card">
        <div class="logo-container">
            <img src="logo.png" alt="iDonate Logo">
        </div>

        <!-- Loading state -->
        <div id="stateLoading" class="state-loading">
            <div class="spinner"></div>
            <h2>Verifying your email…</h2>
            <p>Please wait a moment.</p>
        </div>

        <!-- Success state -->
        <div id="stateSuccess" class="state-success">
            <div class="icon">✅</div>
            <h2>Email Verified!</h2>
            <div class="msg-box msg-success">
                Your account has been successfully activated. You can now log in.
            </div>
            <p>Redirecting to login in <strong id="countdown">3</strong>s…</p>
            <a class="btn" href="./Login.html">Go to Login</a>
        </div>

        <!-- Error state -->
        <div id="stateError" class="state-error">
            <div class="icon">❌</div>
            <h2>Verification Failed</h2>
            <div class="msg-box msg-error" id="errorMessage">
                The verification link is invalid or has expired.
            </div>
            <a class="btn" href="./Register.html">Register Again</a><br>
            <a class="btn-outline" href="./Login.html">Back to Login</a>
        </div>
    </div>

    <script>
        const API_BASE = 'https://idonate-backend-hy7w.onrender.com';

        function showState(name) {
            ['Loading','Success','Error'].forEach(s => {
                document.getElementById('state' + s).style.display = (s === name) ? 'block' : 'none';
            });
        }

        async function verifyToken() {
            const params = new URLSearchParams(window.location.search);
            const token  = params.get('token');

            if (!token) {
                document.getElementById('errorMessage').textContent =
                    'No verification token found. Please use the link from your email.';
                showState('Error');
                return;
            }

            try {
                // The backend GET /auth/verify-email?token=... marks the user verified
                // and returns an HTML page — but we handle it via fetch to check status.
                const response = await fetch(`${API_BASE}/auth/verify-email?token=${encodeURIComponent(token)}`, {
                    method: 'GET',
                    redirect: 'manual'   // prevent following redirects to the backend's HTML page
                });

                // 200 → success HTML from backend
                if (response.ok || response.status === 200) {
                    showState('Success');
                    // Countdown and auto-redirect
                    let secs = 3;
                    const cd = document.getElementById('countdown');
                    const interval = setInterval(() => {
                        secs--;
                        cd.textContent = secs;
                        if (secs <= 0) {
                            clearInterval(interval);
                            window.location.replace('./Login.html');
                        }
                    }, 1000);
                } else {
                    // 400/404 → expired or invalid
                    let msg = 'The verification link is invalid or has expired. Please register again.';
                    try {
                        const text = await response.text();
                        // Extract message text from backend HTML if present
                        const match = text.match(/<div class="msg">([^<]+)<\/div>/);
                        if (match) msg = match[1];
                    } catch (_) {}
                    document.getElementById('errorMessage').textContent = msg;
                    showState('Error');
                }
            } catch (err) {
                document.getElementById('errorMessage').textContent =
                    'Unable to connect to server. Please check your internet connection.';
                showState('Error');
            }
        }

        verifyToken();
    </script>

    <script src="/pwa-register.js"></script>
</body>
</html>
