<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>iDonate - Login</title>
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#dc2626">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="iDonate">
    <link rel="apple-touch-icon" href="/icons/icon-192x192.png">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            min-height: 100vh;
            background: linear-gradient(to bottom right, #fef2f2, #fce7f3);
            display: flex; align-items: center; justify-content: center; padding: 1rem;
        }
        .card {
            background: white; border-radius: 0.5rem;
            box-shadow: 0 20px 25px -5px rgba(0,0,0,0.1);
            padding: 2rem; max-width: 28rem; width: 100%;
        }
        .logo-container { text-align: center; margin-bottom: 1rem; }
        .logo-container img { max-width: 150px; height: auto; }
        .error {
            background-color: #fee2e2; border: 1px solid #fca5a5;
            color: #991b1b; padding: 1rem; border-radius: 0.25rem; margin-bottom: 1rem;
        }
        .info {
            background-color: #eff6ff; border: 1px solid #93c5fd;
            color: #1e40af; padding: 1rem; border-radius: 0.25rem; margin-bottom: 1rem;
            font-size: 0.9rem;
        }
        form { display: flex; flex-direction: column; gap: 1rem; }
        input {
            width: 100%; padding: 0.75rem 1rem;
            border: 1px solid #d1d5db; border-radius: 0.5rem; font-size: 1rem;
        }
        input:focus { outline: none; border-color: #dc2626; box-shadow: 0 0 0 3px rgba(220,38,38,0.1); }
        button {
            width: 100%; background-color: #dc2626; color: white;
            padding: 0.75rem; border-radius: 0.5rem; font-weight: 600;
            border: none; cursor: pointer; transition: background-color 0.3s ease;
        }
        button:hover:not(:disabled) { background-color: #b91c1c; }
        button:disabled { background-color: #9ca3af; cursor: not-allowed; }
        .footer-text { margin-top: 1rem; text-align: center; color: #4b5563; }
        .footer-text a { color: #dc2626; font-weight: 600; text-decoration: none; }
        .footer-text a:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div class="card">
        <div class="logo-container">
            <img src="logo.png" alt="iDonate Logo">
        </div>

        <div id="error" class="error" style="display: none;"></div>
        <div id="info" class="info" style="display: none;"></div>

        <form id="loginForm">
            <input type="email" id="email" placeholder="Email" required>
            <input type="password" id="password" placeholder="Password" required>
            <button type="submit" id="submitBtn">Sign In</button>
        </form>

        <p class="footer-text">
            Don't have an account? <a href="./Register.html">Sign Up</a>
        </p>
    </div>

    <script>
        const API_BASE = 'https://idonate-backend-hy7w.onrender.com';

        // ── FIX: Redirect immediately if already logged in — no flash of login page
        (function checkAlreadyLoggedIn() {
            const token = localStorage.getItem('token');
            if (token) {
                // Replace current history entry so back button from Dashboard
                // does not return to Login.
                history.replaceState(null, '', './Dashboard.html');
                window.location.replace('./Dashboard.html');
            }
        })();

        // Push a sentinel state; if a logged-in user navigates back here, redirect them away.
        history.replaceState({ page: 'login' }, '', './Login.html');
        window.addEventListener('popstate', function () {
            if (localStorage.getItem('token')) {
                window.location.replace('./Dashboard.html');
            }
        });

        function showError(message) {
            const el = document.getElementById("error");
            el.textContent = message;
            el.style.display = "block";
            document.getElementById("info").style.display = "none";
        }

        function showInfo(message) {
            const el = document.getElementById("info");
            el.textContent = message;
            el.style.display = "block";
            document.getElementById("error").style.display = "none";
        }

        function hideMessages() {
            document.getElementById("error").style.display = "none";
            document.getElementById("info").style.display = "none";
        }

        // Clear stale session data from previous user
        function clearPreviousUserSession() {
            localStorage.removeItem('fcm_last_token');
            localStorage.removeItem('fcm_device_id');
            localStorage.removeItem('fcm_needs_reregister');
            localStorage.removeItem('user_is_online');
        }

        document.getElementById("loginForm").addEventListener("submit", async (e) => {
            e.preventDefault();
            hideMessages();

            const email     = document.getElementById("email").value;
            const password  = document.getElementById("password").value;
            const submitBtn = document.getElementById("submitBtn");

            submitBtn.disabled = true;
            submitBtn.textContent = "Please wait...";

            try {
                const body = new URLSearchParams({ username: email, password });
                const response = await fetch(`${API_BASE}/auth/login`, {
                    method:  "POST",
                    headers: { "Content-Type": "application/x-www-form-urlencoded" },
                    body,
                });

                if (response.status === 403) {
                    // Email not verified
                    const err = await response.json().catch(() => null);
                    showInfo(err?.detail || "Your email is not verified. Please check your inbox and click the verification link.");
                    submitBtn.disabled = false;
                    submitBtn.textContent = "Sign In";
                    return;
                }

                if (!response.ok) {
                    const err = await response.json().catch(() => null);
                    throw new Error(err?.detail || "Login failed. Please check your credentials.");
                }

                const data = await response.json();

                // Clear stale session data BEFORE saving the new token.
                clearPreviousUserSession();
                localStorage.setItem("token", data.access_token);

                // Replace current history state so the login page
                // is removed from the browser history stack before navigating.
                history.replaceState(null, '', './Dashboard.html');
                window.location.replace('./Dashboard.html');

            } catch (err) {
                showError(err.message);
                submitBtn.disabled = false;
                submitBtn.textContent = "Sign In";
            }
        });
    </script>

    <script src="/pwa-register.js"></script>
</body>
</html>
