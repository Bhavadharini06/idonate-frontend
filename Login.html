<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>iDonate - Login</title>

<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#ffffff">

<!-- PWA iOS -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="iDonate">
<link rel="apple-touch-icon" href="/icons/icon-192x192.png">

<!-- Instant Redirect -->
<script>
if (localStorage.getItem('token')) {
    window.location.replace('./Dashboard.html');
}
</script>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

/* Splash-like first screen */
body {
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #ffffff;
    font-family: system-ui, -apple-system, sans-serif;
    transition: background 0.4s ease;
}

/* Center logo */
#logo {
    text-align: center;
}

#logo img {
    width: 140px;
}

/* Login UI hidden initially */
#app {
    display: none;
    width: 100%;
    padding: 20px;
}

/* Card */
.card {
    background: #fff;
    border-radius: 16px;
    padding: 30px 20px;
    max-width: 400px;
    margin: auto;
    box-shadow: 0 4px 20px rgba(0,0,0,0.08);
}

.logo-wrap {
    text-align: center;
    margin-bottom: 20px;
}

.logo-wrap img {
    width: 120px;
}

form {
    display: flex;
    flex-direction: column;
    gap: 12px;
}

input {
    padding: 12px;
    border-radius: 10px;
    border: 1px solid #ddd;
}

input:focus {
    outline: none;
    border-color: #dc2626;
}

button {
    padding: 12px;
    background: #dc2626;
    color: #fff;
    border: none;
    border-radius: 10px;
    font-weight: bold;
    cursor: pointer;
}

.footer {
    margin-top: 15px;
    text-align: center;
    font-size: 14px;
}

.footer a {
    color: #dc2626;
    text-decoration: none;
}
</style>
</head>

<body>

<!-- Logo only -->
<div id="logo">
    <img src="logo.png" alt="iDonate">
</div>

<!-- Login UI -->
<div id="app">
    <div class="card">
        <div class="logo-wrap">
            <img src="logo.png">
        </div>

        <form id="loginForm">
            <input type="email" id="email" placeholder="Email" required>
            <input type="password" id="password" placeholder="Password" required>
            <button type="submit">Sign In</button>
        </form>

        <div class="footer">
            Don't have an account? <a href="./Register.html">Sign Up</a>
        </div>
    </div>
</div>

<script>
// Smooth transition (logo → login)
window.addEventListener('load', () => {
    setTimeout(() => {
        document.getElementById('logo').style.display = 'none';
        document.body.style.background = "#fce7f3";
        document.getElementById('app').style.display = 'block';
    }, 900);
});

// Login API
const API_BASE = 'https://idonate-backend-hy7w.onrender.com';

document.getElementById('loginForm').addEventListener('submit', async (e) => {
    e.preventDefault();

    const email = email.value;
    const password = password.value;

    const res = await fetch(`${API_BASE}/auth/login`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
        body: new URLSearchParams({ username: email, password })
    });

    if (res.ok) {
        const data = await res.json();
        localStorage.setItem('token', data.access_token);
        window.location.replace('./Dashboard.html');
    } else {
        alert("Login failed");
    }
});
</script>

<script src="/pwa-register.js"></script>

</body>
</html>
