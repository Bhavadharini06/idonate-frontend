<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>iDonate - Login</title>
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#dc2626">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="iDonate">
    <link rel="apple-touch-icon" href="/icons/icon-192x192.png">

    <!-- Instant redirect — runs in <head> before ANY paint. Zero login-page flash. -->
    <script>
        if (localStorage.getItem('token')) {
            window.location.replace('./Dashboard.html');
        }
    </script>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            min-height: 100vh;
            background: #fce7f3;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.25rem;
        }
        .card {
            background: #ffffff;
            border-radius: 16px;
            box-shadow: 0 4px 24px rgba(0, 0, 0, 0.08);
            padding: 2.5rem 2rem;
            max-width: 25rem;
            width: 100%;
        }
        .logo-wrap {
            text-align: center;
            margin-bottom: 1.5rem;
        }
        .logo-wrap img { max-width: 130px; height: auto; }
        .alert {
            border-radius: 8px;
            padding: 0.8rem 1rem;
            font-size: 0.875rem;
            line-height: 1.55;
            margin-bottom: 1.25rem;
        }
        .alert-error { background: #fef2f2; border: 1px solid #fecaca; color: #dc2626; }
        .alert-info  { background: #eff6ff; border: 1px solid #bfdbfe; color: #1d4ed8; }
        form { display: flex; flex-direction: column; gap: 0.875rem; }
        input {
            width: 100%;
            padding: 0.75rem 1rem;
            border: 1.5px solid #e5e7eb;
            border-radius: 10px;
            font-size: 0.9375rem;
            color: #111827;
            background: #f9fafb;
            transition: border-color 0.18s, box-shadow 0.18s, background 0.18s;
        }
        input:focus {
            outline: none;
            background: #fff;
            border-color: #dc2626;
            box-shadow: 0 0 0 3px rgba(220, 38, 38, 0.08);
        }
        .btn-submit {
            width: 100%;
            background: #dc2626;
            color: #fff;
            padding: 0.8125rem;
            border-radius: 10px;
            font-size: 0.9375rem;
            font-weight: 600;
            border: none;
            cursor: pointer;
            margin-top: 0.25rem;
            transition: background 0.18s, transform 0.12s, box-shadow 0.18s;
            box-shadow: 0 1px 4px rgba(220, 38, 38, 0.2);
        }
        .btn-submit:hover:not(:disabled) {
            background: #b91c1c;
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(220, 38, 38, 0.25);
        }
        .btn-submit:active:not(:disabled) { transform: translateY(0); }
        .btn-submit:disabled { background: #d1d5db; cursor: not-allowed; box-shadow: none; }
        .footer-link {
            margin-top: 1.5rem;
            text-align: center;
            font-size: 0.875rem;
            color: #6b7280;
        }
        .footer-link a { color: #dc2626; font-weight: 600; text-decoration: none; }
        .footer-link a:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div class="card">
        <div class="logo-wrap">
            <img src="logo.png" alt="iDonate">
        </div>

        <div id="alertError" class="alert alert-error" style="display:none;"></div>
        <div id="alertInfo"  class="alert alert-info"  style="display:none;"></div>

        <form id="loginForm">
            <input type="email"    id="email"    placeholder="Email address" required autocomplete="email">
            <input type="password" id="password" placeholder="Password"      required autocomplete="current-password">
            <button type="submit" id="submitBtn" class="btn-submit">Sign In</button>
        </form>

        <p class="footer-link">
            Don't have an account? <a href="./Register.html">Sign Up</a>
        </p>
    </div>

    <script>
        const API_BASE = 'https://idonate-backend-hy7w.onrender.com';

        function showError(msg) {
            const el = document.getElementById('alertError');
            el.textContent = msg;
            el.style.display = 'block';
            document.getElementById('alertInfo').style.display = 'none';
        }

        function showInfo(msg) {
            const el = document.getElementById('alertInfo');
            el.textContent = msg;
            el.style.display = 'block';
            document.getElementById('alertError').style.display = 'none';
        }

        function hideAlerts() {
            document.getElementById('alertError').style.display = 'none';
            document.getElementById('alertInfo').style.display  = 'none';
        }

        function clearPreviousSession() {
            ['fcm_last_token', 'fcm_device_id', 'fcm_needs_reregister', 'user_is_online']
                .forEach(k => localStorage.removeItem(k));
        }

        function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }

        // FIX: Proactively wake the server when the login page loads.
        // Render free tier sleeps after ~15 min of inactivity. The wake-up
        // ping runs silently in the background so by the time the user
        // fills in their credentials, the server is already warm.
        async function wakeServer() {
            try {
                await fetch(`${API_BASE}/`, { signal: AbortSignal.timeout(60000) });
                console.log('[iDonate] Server warm.');
            } catch (e) {
                console.warn('[iDonate] Wake ping failed (will retry on login):', e.message);
            }
        }
        wakeServer(); // fire-and-forget on page load

        // FIX: Login fetch now retries on network errors (ERR_FAILED) caused
        // by Render cold start CORS preflight failures. Retries up to 3 times
        // with 3s backoff. Auth/validation errors (4xx) are NOT retried.
        async function loginWithRetry(email, password, retries = 3) {
            for (let attempt = 1; attempt <= retries; attempt++) {
                try {
                    const res = await fetch(`${API_BASE}/auth/login`, {
                        method:  'POST',
                        headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                        body:    new URLSearchParams({ username: email, password }),
                    });

                    if (res.status === 403) {
                        const err = await res.json().catch(() => null);
                        throw Object.assign(
                            new Error(err?.detail || 'Please verify your email before signing in.'),
                            { isVerificationError: true }
                        );
                    }

                    if (!res.ok) {
                        // 4xx = real credential error, don't retry
                        if (res.status < 500) {
                            const err = await res.json().catch(() => null);
                            throw new Error(err?.detail || 'Incorrect email or password.');
                        }
                        // 5xx = server error, retry
                        if (attempt < retries) {
                            console.warn(`[iDonate] Login 5xx (attempt ${attempt}/${retries}), retrying...`);
                            await sleep(3000 * attempt);
                            continue;
                        }
                        throw new Error('Server error. Please try again in a moment.');
                    }

                    return await res.json(); // success

                } catch (err) {
                    // Don't retry real errors (non-network)
                    if (err.isVerificationError || !(err instanceof TypeError)) {
                        throw err;
                    }
                    // Network/CORS error (TypeError) — retry
                    if (attempt < retries) {
                        console.warn(`[iDonate] Login network error (attempt ${attempt}/${retries}):`, err.message);
                        await sleep(3000 * attempt);
                        continue;
                    }
                    throw new Error('Unable to connect. The server may be starting up — please try again in 30 seconds.');
                }
            }
        }

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            hideAlerts();

            const email    = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const btn      = document.getElementById('submitBtn');

            btn.disabled    = true;
            btn.textContent = 'Signing in...';

            try {
                const data = await loginWithRetry(email, password);
                clearPreviousSession();
                localStorage.setItem('token', data.access_token);
                history.replaceState(null, '', './Dashboard.html');
                window.location.replace('./Dashboard.html');
            } catch (err) {
                if (err.isVerificationError) {
                    showInfo(err.message);
                } else {
                    showError(err.message);
                }
                btn.disabled    = false;
                btn.textContent = 'Sign In';
            }
        });
    </script>
    <script src="/pwa-register.js"></script>
</body>
</html>
