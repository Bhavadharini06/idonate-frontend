<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>iDonate - Home</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            min-height: 100vh;
            background: linear-gradient(to bottom right, #fef2f2, #fce7f3);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem;
        }
        .container {
            text-align: center;
        }
        .logo {
            max-width: 250px;
            width: 80%;
            height: auto;
        }
        @media (max-width: 640px) {
            .logo {
                max-width: 280px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <img src="logo.png" alt="iDonate Logo" class="logo">
    </div>
    <script>
        setTimeout(() => {
            window.location.href = './Login.html';
        }, 1000);
    </script>
</body>
</html>
