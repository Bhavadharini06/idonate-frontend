<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>iDonate - Register</title>
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#dc2626">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="iDonate">
    <link rel="apple-touch-icon" href="/icons/icon-192x192.png">

    <script>
        if (localStorage.getItem('token')) {
            window.location.replace('./Dashboard.html');
        }
    </script>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            min-height: 100vh;
            background: linear-gradient(to bottom right, #fef2f2, #fce7f3);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.25rem;
        }
        .card {
            background: #ffffff;
            border-radius: 16px;
            box-shadow: 0 4px 24px rgba(0, 0, 0, 0.08);
            padding: 2.5rem 2rem;
            max-width: 25rem;
            width: 100%;
        }
        .logo-wrap {
            text-align: center;
            margin-bottom: 1.75rem;
        }
        .logo-wrap img { max-width: 130px; height: auto; }
        .alert-error {
            background: #fef2f2;
            border: 1px solid #fecaca;
            color: #dc2626;
            padding: 0.8rem 1rem;
            border-radius: 8px;
            font-size: 0.875rem;
            margin-bottom: 1.25rem;
        }
        form { display: flex; flex-direction: column; gap: 0.875rem; }
        input, select {
            width: 100%;
            padding: 0.75rem 1rem;
            border: 1.5px solid #e5e7eb;
            border-radius: 10px;
            font-size: 0.9375rem;
            color: #111827;
            background: #f9fafb;
            transition: border-color 0.18s, box-shadow 0.18s, background 0.18s;
        }
        input:focus, select:focus {
            outline: none;
            background: #fff;
            border-color: #dc2626;
            box-shadow: 0 0 0 3px rgba(220, 38, 38, 0.08);
        }
        .btn-submit {
            width: 100%;
            background: #dc2626;
            color: #fff;
            padding: 0.8125rem;
            border-radius: 10px;
            font-size: 0.9375rem;
            font-weight: 600;
            border: none;
            cursor: pointer;
            margin-top: 0.25rem;
            transition: background 0.18s, transform 0.12s, box-shadow 0.18s;
            box-shadow: 0 1px 4px rgba(220, 38, 38, 0.2);
        }
        .btn-submit:hover:not(:disabled) {
            background: #b91c1c;
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(220, 38, 38, 0.25);
        }
        .btn-submit:active:not(:disabled) { transform: translateY(0); }
        .btn-submit:disabled { background: #d1d5db; cursor: not-allowed; box-shadow: none; }
        .footer-link {
            margin-top: 1.5rem;
            text-align: center;
            font-size: 0.875rem;
            color: #6b7280;
        }
        .footer-link a { color: #dc2626; font-weight: 600; text-decoration: none; }
        .footer-link a:hover { text-decoration: underline; }

        /* ── Email sent confirmation panel ── */
        .sent-panel {
            display: none;
            text-align: center;
            padding: 0.5rem 0;
        }
        .sent-icon {
            font-size: 2.25rem;
            margin-bottom: 0.875rem;
            line-height: 1;
        }
        .sent-title {
            font-size: 1.125rem;
            font-weight: 700;
            color: #111827;
            letter-spacing: -0.02em;
            margin-bottom: 0.625rem;
        }
        .sent-body {
            font-size: 0.875rem;
            color: #6b7280;
            line-height: 1.65;
            margin-bottom: 0.5rem;
        }
        .sent-body strong { color: #374151; }
        .sent-email {
            color: #dc2626;
            font-weight: 600;
            word-break: break-all;
        }
        .sent-note {
            font-size: 0.8rem;
            color: #9ca3af;
            margin-top: 0.5rem;
        }
        .sent-back {
            display: inline-block;
            margin-top: 1.25rem;
            font-size: 0.875rem;
            color: #dc2626;
            font-weight: 600;
            text-decoration: none;
        }
        .sent-back:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div class="card">
        <div class="logo-wrap">
            <img src="logo.png" alt="iDonate">
        </div>

        <div id="alertError" class="alert-error" style="display:none;"></div>

        <!-- Registration form -->
        <div id="formSection">
            <form id="registerForm">
                <input type="text"     id="name"            placeholder="Full Name"         required>
                <input type="email"    id="email"           placeholder="Email address"     required>
                <input type="tel"      id="phone"           placeholder="Phone Number"      required>
                <select id="bloodgroup" required>
                    <option value="">Select Blood Group</option>
                    <option value="A+">A+</option>
                    <option value="A-">A-</option>
                    <option value="B+">B+</option>
                    <option value="B-">B-</option>
                    <option value="AB+">AB+</option>
                    <option value="AB-">AB-</option>
                    <option value="O+">O+</option>
                    <option value="O-">O-</option>
                </select>
                <input type="password" id="password"        placeholder="Password"          required>
                <input type="password" id="confirmPassword" placeholder="Confirm Password"  required>
                <button type="submit" id="submitBtn" class="btn-submit">Create Account</button>
            </form>
            <p class="footer-link">
                Already have an account? <a href="./Login.html">Sign In</a>
            </p>
        </div>

        <!-- Shown after successful registration -->
        <div id="sentPanel" class="sent-panel">
            <div class="sent-icon">📧</div>
            <p class="sent-title">Check Your Email</p>
            <p class="sent-body">
                We sent a verification link to<br>
                <span class="sent-email" id="confirmedEmail"></span>
            </p>
            <p class="sent-body">
                Click the link to activate your account.<br>
                It expires in <strong>24 hours</strong>.
            </p>
            <p class="sent-note">Can't find it? Check your spam folder.</p>
            <a class="sent-back" href="./Login.html">← Back to Login</a>
        </div>
    </div>

    <script>
        const API_BASE = 'https://idonate-backend-hy7w.onrender.com';

        function showError(msg) {
            const el = document.getElementById('alertError');
            el.textContent = msg;
            el.style.display = 'block';
        }
        function hideError() {
            document.getElementById('alertError').style.display = 'none';
        }

        document.getElementById('registerForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            hideError();

            const name            = document.getElementById('name').value.trim();
            const email           = document.getElementById('email').value.trim();
            const phone           = document.getElementById('phone').value.trim();
            const bloodgroup      = document.getElementById('bloodgroup').value;
            const password        = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            const btn             = document.getElementById('submitBtn');

            if (!name || !email || !phone || !bloodgroup || !password) {
                showError('Please fill in all fields.');
                return;
            }
            if (password !== confirmPassword) {
                showError('Passwords do not match.');
                return;
            }
            if (password.length < 6) {
                showError('Password must be at least 6 characters.');
                return;
            }

            btn.disabled    = true;
            btn.textContent = 'Creating Account…';

            try {
                const res = await fetch(`${API_BASE}/auth/register`, {
                    method:  'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body:    JSON.stringify({ email, name, phone, bloodgroup, password }),
                });

                if (!res.ok) {
                    const err = await res.json().catch(() => null);
                    throw new Error(err?.detail || 'Registration failed. Please try again.');
                }

                document.getElementById('confirmedEmail').textContent = email;
                document.getElementById('formSection').style.display  = 'none';
                document.getElementById('sentPanel').style.display    = 'block';

            } catch (err) {
                showError(err.message);
                btn.disabled    = false;
                btn.textContent = 'Create Account';
            }
        });
    </script>
    <script src="/pwa-register.js"></script>
</body>
</html>
