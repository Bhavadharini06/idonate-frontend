<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>iDonate - Register</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            min-height: 100vh;
            background: linear-gradient(to bottom right, #fef2f2, #fce7f3);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem;
        }
        .card {
            background: white;
            border-radius: 0.5rem;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1);
            padding: 2rem;
            max-width: 28rem;
            width: 100%;
        }
        .logo-container {
            text-align: center;
            margin-bottom: 1rem;
        }
        .logo-container img {
            max-width: 150px;
            height: auto;
        }
        .error {
            background-color: #fee2e2;
            border: 1px solid #fca5a5;
            color: #991b1b;
            padding: 1rem;
            border-radius: 0.25rem;
            margin-bottom: 1rem;
        }
        .success {
            background-color: #d1fae5;
            border: 1px solid #6ee7b7;
            color: #065f46;
            padding: 1rem;
            border-radius: 0.25rem;
            margin-bottom: 1rem;
        }
        form {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }
        input, select {
            width: 100%;
            padding: 0.75rem 1rem;
            border: 1px solid #d1d5db;
            border-radius: 0.5rem;
            font-size: 1rem;
        }
        input:focus, select:focus {
            outline: none;
            border-color: #dc2626;
            box-shadow: 0 0 0 3px rgba(220, 38, 38, 0.1);
        }
        button {
            width: 100%;
            background-color: #dc2626;
            color: white;
            padding: 0.75rem;
            border-radius: 0.5rem;
            font-weight: 600;
            border: none;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }
        button:hover:not(:disabled) {
            background-color: #b91c1c;
        }
        button:disabled {
            background-color: #9ca3af;
            cursor: not-allowed;
        }
        .footer-text {
            margin-top: 1rem;
            text-align: center;
            color: #4b5563;
        }
        .footer-text a {
            color: #dc2626;
            font-weight: 600;
            text-decoration: none;
        }
        .footer-text a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="logo-container">
            <img src="logo.png" alt="iDonate Logo">
        </div>
        <div id="error" class="error" style="display: none;"></div>
        <div id="success" class="success" style="display: none;"></div>
        <form id="registerForm">
            <input type="text" id="name" placeholder="Full Name" required>
            <input type="email" id="email" placeholder="Email" required>
            <input type="tel" id="phone" placeholder="Phone Number" required>
            <select id="bloodgroup" required>
                <option value="">Select Blood Group</option>
                <option value="A+">A+</option>
                <option value="A-">A-</option>
                <option value="B+">B+</option>
                <option value="B-">B-</option>
                <option value="AB+">AB+</option>
                <option value="AB-">AB-</option>
                <option value="O+">O+</option>
                <option value="O-">O-</option>
            </select>
            <input type="password" id="password" placeholder="Password" required>
            <input type="password" id="confirmPassword" placeholder="Confirm Password" required>
            <button type="submit" id="submitBtn">Create Account</button>
        </form>
        <p class="footer-text">
            Already have an account? <a href="./Login.html">Sign In</a>
        </p>
    </div>
    <script>
        const API_BASE = "https://localhost:8000";

        function showError(message) {
            const errorDiv = document.getElementById("error");
            errorDiv.textContent = message;
            errorDiv.style.display = "block";
            document.getElementById("success").style.display = "none";
        }

        function showSuccess(message) {
            const successDiv = document.getElementById("success");
            successDiv.textContent = message;
            successDiv.style.display = "block";
            document.getElementById("error").style.display = "none";
        }

        function hideMessages() {
            document.getElementById("error").style.display = "none";
            document.getElementById("success").style.display = "none";
        }

        document.getElementById("registerForm").addEventListener("submit", async (e) => {
            e.preventDefault();
            hideMessages();

            const name = document.getElementById("name").value.trim();
            const email = document.getElementById("email").value.trim();
            const phone = document.getElementById("phone").value.trim();
            const bloodgroup = document.getElementById("bloodgroup").value;
            const password = document.getElementById("password").value;
            const confirmPassword = document.getElementById("confirmPassword").value;
            const submitBtn = document.getElementById("submitBtn");

            if (!name || !email || !phone || !bloodgroup || !password) {
                showError("Please fill in all fields");
                return;
            }

            if (password !== confirmPassword) {
                showError("Passwords do not match");
                return;
            }

            if (password.length < 6) {
                showError("Password must be at least 6 characters long");
                return;
            }

            submitBtn.disabled = true;
            submitBtn.textContent = "Sending OTP...";

            try {
                const response = await fetch(`${API_BASE}/auth/request-otp`, {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json",
                    },
                    body: JSON.stringify({
                        email,
                        name,
                        phone,
                        bloodgroup,
                        password
                    }),
                });

                if (!response.ok) {
                    const err = await response.json().catch(() => null);
                    throw new Error(err?.detail || "Registration failed. Please try again.");
                }

                const data = await response.json();
                
                localStorage.setItem("pending_email", email);
                
                showSuccess("OTP sent to your email! Check your inbox.");
                
                setTimeout(() => {
                    window.location.href = "./OTPverify.html";
                }, 1500);
                
            } catch (err) {
                showError(err.message);
                submitBtn.disabled = false;
                submitBtn.textContent = "Create Account";
            }
        });
    </script>
</body>
</html>
