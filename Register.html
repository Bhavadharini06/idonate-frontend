<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>iDonate - Register</title>
<link rel="manifest" href="/manifest.json" />
<meta name="theme-color" content="#dc2626" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="iDonate" />
<link rel="apple-touch-icon" href="/icons/icon-192x192.png" />
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;min-height:100vh;background:#fce7f3;display:flex;align-items:center;justify-content:center;padding:1.25rem;}
.card{background:#ffffff;border-radius:16px;box-shadow:0 4px 24px rgba(0,0,0,0.08);padding:2.5rem 2rem;max-width:25rem;width:100%;}
.logo-wrap{text-align:center;margin-bottom:0.6rem;}
.logo-wrap img{max-width:130px;height:auto;}
.alert-error{background:#fef2f2;border:1px solid #fecaca;color:#dc2626;padding:0.8rem 1rem;border-radius:8px;font-size:0.875rem;margin-bottom:1.25rem;}
form{display:flex;flex-direction:column;gap:0.875rem;}
input,select{width:100%;padding:0.75rem 1rem;border:1.5px solid #e5e7eb;border-radius:10px;font-size:0.9375rem;color:#111827;background:#f9fafb;transition:border-color .18s,box-shadow .18s;}
input:focus,select:focus{outline:none;background:#fff;border-color:#dc2626;box-shadow:0 0 0 3px rgba(220,38,38,0.08);}
.btn-submit{width:100%;background:#dc2626;color:#fff;padding:0.8125rem;border-radius:10px;font-size:0.9375rem;font-weight:600;border:none;cursor:pointer;margin-top:4px;transition:background .18s;}
.btn-submit:hover:not(:disabled){background:#b91c1c;}
.btn-submit:disabled{background:#d1d5db;cursor:not-allowed;}
.footer-link{margin-top:1.4rem;text-align:center;font-size:0.875rem;color:#6b7280;}
.footer-link a{color:#dc2626;font-weight:600;text-decoration:none;}
.footer-link a:hover{text-decoration:underline;}
.sent-panel{display:none;text-align:center;padding-top:0.3rem;}
.sent-icon{font-size:2rem;margin:4px auto;}
.sent-title{margin-top:6px;font-weight:700;font-size:1.2rem;color:#111827;}
.sent-body{margin-top:6px;font-size:0.9rem;color:#6b7280;line-height:1.6;}
.sent-email{display:block;margin-top:4px;color:#dc2626;font-weight:600;word-break:break-word;}
</style>
<script>
if(localStorage.getItem('token')){
  window.location.replace('./Dashboard.html');
}
</script>
</head>
<body>
<div class="card">
  <div class="logo-wrap">
    <img src="logo.png" alt="iDonate">
  </div>
  <div id="alertError" class="alert-error" style="display:none;"></div>

  <!-- REGISTRATION FORM -->
  <div id="formSection">
    <form id="registerForm">
      <input type="text"     id="name"            placeholder="Full Name"        required>
      <input type="email"    id="email"           placeholder="Email address"    required>
      <input type="tel"      id="phone"           placeholder="Phone Number"     required>
      <select id="bloodgroup" required>
        <option value="">Select Blood Group</option>
        <option value="A+">A+</option>
        <option value="A-">A-</option>
        <option value="B+">B+</option>
        <option value="B-">B-</option>
        <option value="AB+">AB+</option>
        <option value="AB-">AB-</option>
        <option value="O+">O+</option>
        <option value="O-">O-</option>
      </select>
      <input type="password" id="password"        placeholder="Password"         required>
      <input type="password" id="confirmPassword" placeholder="Confirm Password" required>
      <button type="submit" id="submitBtn" class="btn-submit">Create Account</button>
    </form>
    <p class="footer-link">
      Already have an account? <a href="./Login.html">Sign In</a>
    </p>
  </div>

  <!-- EMAIL SENT CONFIRMATION -->
  <div id="sentPanel" class="sent-panel">
    <div class="sent-icon">📧</div>
    <p class="sent-title">Check Your Email</p>
    <p class="sent-body">
      We sent a verification link to
      <span id="confirmedEmail" class="sent-email"></span>
    </p>
    <p class="sent-body">
      Click the link to activate your account.<br>
      It expires in <strong>24 hours</strong>.
    </p>
    <!--
      FIX: The old code called /auth/resend-verification which does NOT exist.
      The backend re-sends verification when you POST /auth/register with an
      already-registered but unverified email. So we call /auth/register again.
    -->
    <button id="resendBtn" class="btn-submit" style="margin-top:18px;">
      Resend Verification Link
    </button>
  </div>
</div>

<script>
const API_BASE = 'https://idonate-backend-hy7w.onrender.com';

// Store registration data so we can resend using /auth/register
let _lastRegistrationData = null;

function showError(msg){
  const el = document.getElementById('alertError');
  el.textContent = msg;
  el.style.display = 'block';
}

function hideError(){
  document.getElementById('alertError').style.display = 'none';
}

function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }

// FIX: Proactively wake the server when the register page loads.
// Render free tier sleeps after ~15 min inactivity. This silent ping
// runs as the user fills the form, so it's warm on submit.
async function wakeServer() {
    try {
        await fetch(`${API_BASE}/`, { signal: AbortSignal.timeout(60000) });
        console.log('[iDonate] Server warm.');
    } catch (e) {
        console.warn('[iDonate] Wake ping failed:', e.message);
    }
}
wakeServer(); // fire-and-forget on page load

// FIX: Register fetch retries on network errors (ERR_FAILED) from
// Render cold start CORS preflight failures. 4xx errors are NOT retried.
async function registerWithRetry(payload, retries = 3) {
    for (let attempt = 1; attempt <= retries; attempt++) {
        try {
            const res = await fetch(`${API_BASE}/auth/register`, {
                method:  'POST',
                headers: {'Content-Type': 'application/json'},
                body:    JSON.stringify(payload)
            });

            if (!res.ok) {
                if (res.status < 500) {
                    const err = await res.json().catch(() => null);
                    throw new Error(err?.detail || 'Registration failed');
                }
                if (attempt < retries) {
                    console.warn(`[iDonate] Register 5xx (attempt ${attempt}/${retries}), retrying...`);
                    await sleep(3000 * attempt);
                    continue;
                }
                throw new Error('Server error. Please try again in a moment.');
            }

            return res; // return response object for caller to use

        } catch (err) {
            if (!(err instanceof TypeError)) throw err; // real error, don't retry
            if (attempt < retries) {
                console.warn(`[iDonate] Register network error (attempt ${attempt}/${retries}):`, err.message);
                await sleep(3000 * attempt);
                continue;
            }
            throw new Error('Unable to connect. The server may be starting up — please try again in 30 seconds.');
        }
    }
}

document.getElementById('registerForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  hideError();

  const name            = document.getElementById('name').value.trim();
  const email           = document.getElementById('email').value.trim();
  const phone           = document.getElementById('phone').value.trim();
  const bloodgroup      = document.getElementById('bloodgroup').value;
  const password        = document.getElementById('password').value;
  const confirmPassword = document.getElementById('confirmPassword').value;
  const btn             = document.getElementById('submitBtn');

  if(!name || !email || !phone || !bloodgroup || !password){
    showError('Please fill in all fields.');
    return;
  }

  if(password !== confirmPassword){
    showError('Passwords do not match.');
    return;
  }

  if(password.length < 6){
    showError('Password must be at least 6 characters.');
    return;
  }

  btn.disabled    = true;
  btn.textContent = 'Creating Account...';

  try {
    const res = await registerWithRetry({email, name, phone, bloodgroup, password});

    // Store data for potential resend
    _lastRegistrationData = {email, name, phone, bloodgroup, password};
    document.getElementById('confirmedEmail').textContent = email;
    document.getElementById('formSection').style.display  = 'none';
    document.getElementById('sentPanel').style.display    = 'block';

  } catch(err) {
    showError(err.message);
    btn.disabled    = false;
    btn.textContent = 'Create Account';
  }
});

/* RESEND VERIFICATION
   FIX: Call /auth/register again with same data (with retry).
   The backend detects the email already exists but is unverified,
   and resends the verification email instead of creating a duplicate.
*/
document.getElementById('resendBtn').addEventListener('click', async () => {
  const btn   = document.getElementById('resendBtn');
  const email = document.getElementById('confirmedEmail').textContent;

  if (!_lastRegistrationData) {
    alert('Please refresh the page and register again.');
    return;
  }

  btn.disabled    = true;
  btn.textContent = 'Sending...';

  try {
    const res = await registerWithRetry(_lastRegistrationData);
    const data = await res.json().catch(() => null);

    if (res.ok) {
      alert('Verification email sent again. Please check your inbox.');
    } else {
      const detail = data?.detail || '';
      if (detail.toLowerCase().includes('already registered') || detail.toLowerCase().includes('login')) {
        alert('Your email is already verified! Please go to Login.');
        window.location.replace('./Login.html');
      } else {
        alert(detail || 'Failed to resend email. Please try again.');
      }
    }
  } catch(err) {
    alert(err.message || 'Failed to resend. Please try again.');
  } finally {
    btn.disabled    = false;
    btn.textContent = 'Resend Email';
  }
});
</script>
<script src="/pwa-register.js"></script>
</body>
</html>
